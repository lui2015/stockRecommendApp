<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>求一票 · 我的记录</title>
<link rel="stylesheet" href="css/style.css" />

<body class="history-page">
<div class="app">

  <!-- 顶部导航 -->
  <header class="topbar">

    <span class="topbar-title">我的记录</span>

  <h2 class="history-title">历史推荐</h2>

  <!-- 列表容器 -->
  <div id="historyList"></div>

  <!-- 空状态 -->
  <div class="empty-state hidden" id="historyEmpty">

</div>

    <div class="roundtable-list" id="roundtableList"></div>

  </div>
</div>

<!-- 导航侧边栏 -->
