<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>求一票 · 分析报告</title>
<link rel="stylesheet" href="css/analysis.css" />
</head>
<body class="analysis-page-body">

<div class="analysis-page">

  <header class="analysis-header">
    <button type="button" class="back-btn" id="backBtn" aria-label="返回">←</button>
    <div class="analysis-title">
      <h1 id="rptName">加载中…</h1>
      <div class="analysis-meta">
        <span class="analysis-sub" id="rptSub"></span>
      </div>
      <div class="price-row">
     <span class="price" id="rptPrice"></span>
   <span class="change" id="rptChange"></span>
    </div>
    </div>
  </header>

  <div id="loadingState" class="loading-state">
    <div class="loading-slot-machine">
      <div class="loading-reels">
        <span class="loading-reel">📊</span>
        <span class="loading-reel">📈</span>
        <span class="loading-reel">💰</span>
      </div>
      <div class="loading-lights"></div>
    </div>
    <p class="loading-text">正在生成深度分析报告…</p>
    <p class="loading-subtext">AI 正在从基本面、消息面、技术面多维度深度挖掘</p>
  </div>

  <div id="errorState" class="error-state hidden">
    <p id="errorMsg">⚠️ 加载失败，请返回重试</p>
    <div class="error-actions">
      <button type="button" class="retry-btn" id="retryBtn">🔄 重新加载</button>
      <a href="index.html" class="back-link">← 返回首页</a>
 </div>
  </div>

  <div id="reportContainer" class="hidden">

    <section class="rpt-section">
      <h2>📊 关键指标</h2>
      <div class="snapshot-grid" id="snapshotGrid"></div>
      <p class="data-note" id="dataNote"></p>
    </section>

    <section class="rpt-section">
      <h2>📈 近5年股价中位数</h2>
      <div class="chart-box">
  <canvas id="medianChart"></canvas>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
<th>年份</th>
            <th>中位数</th>
   <th>最高</th>
          <th>最低</th>
         <th>交易日</th>
      </tr>
      </thead>
    <tbody id="medianTbody"></tbody>
          <tfoot id="medianTfoot"></tfoot>
</table>
      </div>
      <p class="data-note" id="medianNote"></p>
    </section>

    <section class="rpt-section">
      <h2>💰 盈利能力</h2>
      <div class="chart-box">
        <canvas id="profitChart"></canvas>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>年份</th>
              <th>净利润</th>
     <th>同比</th>
    <th>营收</th>
     <th>毛利率</th>
              <th>ROE</th>
 </tr>
    </thead>
  <tbody id="profitTbody"></tbody>
        </table>
      </div>
    </section>

    <!-- 近五年分红数据 -->
    <section class="rpt-section" id="dividendSection">
      <h2><span class="section-icon">💰</span> 近五年分红数据</h2>
      <p class="section-sub" id="dividendSummary"></p>
      <div class="chart-wrap">
        <canvas id="dividendChart"></canvas>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="dividendTable">
          <thead><tr><th>年份</th><th>每股分红</th><th>股息率</th><th>分红率</th><th>特别分红</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="rpt-section">
<h2>🌍 宏观环境</h2>
    <div class="macro-box" id="macroBox"></div>
    </section>

    <section class="rpt-section">
      <h2>🎙️ 四派圆桌讨论</h2>
      <div class="roundtable-box" id="roundtableBox"></div>
    </section>

    <section class="rpt-section">
      <h2>🧭 综合结论</h2>
      <div class="summary-card" id="summaryCard"></div>
    </section>

    <p class="disclaimer" id="disclaimerText"></p>

  </div>

</div>

<div class="toast hidden" id="toast"></div>

<script src="js/common.js"></script>
<script src="js/analysis.js"></script>
</body>
</html>
